<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>音质 A/B：8bit vs bf16</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 30px 38px 60px; background: #14121a; color: #ece8f4;
         font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  p.sub { color: #948da6; margin: 0 0 22px; font-size: 13px; }
  .card { background: #1e1b26; border: 1px solid #322c40; border-radius: 14px;
          padding: 14px 18px; margin-bottom: 12px; max-width: 720px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .name { width: 130px; font-weight: 600; }
  .tag { font-size: 12px; color: #948da6; }
  audio { flex: 1; height: 32px; }
  .note { color: #8b849a; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>音质对比</h1>
  <p class="sub">同一句、同一音色（Sohee）、同一语气，只有模型精度不同。</p>

  <div class="card">
    <div class="row"><span class="name">8bit（之前）</span><span class="tag">量化版</span>
      <audio controls preload="auto" src="samples/ab_8bit.wav"></audio></div>
    <div class="note">体积小、显存低，细节略钝。</div>
  </div>

  <div class="card">
    <div class="row"><span class="name">bf16（现在）</span><span class="tag">未量化</span>
      <audio controls preload="auto" src="samples/ab_bf16.wav"></audio></div>
    <div class="note">完整精度，齿音和气声更清楚。</div>
  </div>
</body>
</html>
