<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>更年轻的声音 · 候选</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 30px 38px 60px; background: #14121a; color: #ece8f4;
         font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  p.sub { color: #948da6; margin: 0 0 20px; font-size: 13px; }
  .card { background: #1e1b26; border: 1px solid #322c40; border-radius: 14px;
          padding: 14px 18px; margin-bottom: 12px; max-width: 740px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .name { width: 150px; font-weight: 600; }
  .tag { font-size: 12px; color: #948da6; width: 96px; }
  audio { flex: 1; height: 32px; }
  .note { color: #8b849a; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
  <h1>更年轻一点的候选</h1>
  <p class="sub">都在 8bit 模型上，同一句话。先听第一条当基准，再比后面三条。</p>

  <div class="card">
    <div class="row"><span class="name">Sohee 原速</span><span class="tag">当前</span>
      <audio controls preload="auto" src="samples/v_sohee_norm_000.wav"></audio></div>
    <div class="note">现在的直播音色，语速正常。</div>
  </div>

  <div class="card">
    <div class="row"><span class="name">Sohee 快 10%</span><span class="tag">更活泼</span>
      <audio controls preload="auto" src="samples/v_sohee_fast_000.wav"></audio></div>
    <div class="note">只说快一点，音高不变，听着更精神。</div>
  </div>

  <div class="card">
    <div class="row"><span class="name">Sohee 稚嫩提示</span><span class="tag">更小</span>
      <audio controls preload="auto" src="samples/v_sohee_young_000.wav"></audio></div>
    <div class="note">用语气描述让她“稚嫩一点、脆一点”，快 6%。</div>
  </div>

  <div class="card">
    <div class="row"><span class="name">Ono Anna 挑衅</span><span class="tag">更嗲</span>
      <audio controls preload="auto" src="samples/v_anna_brat_000.wav"></audio></div>
    <div class="note">之前否掉的音色，这次配轻挑语气，快 6%。</div>
  </div>
</body>
</html>
