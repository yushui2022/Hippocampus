<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>大肥鱼 · 雌小鬼音色</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 30px 38px 70px; background: #14121a; color: #ece8f4;
         font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  h1 { font-size: 21px; margin: 0 0 4px; font-weight: 600; }
  p.sub { color: #948da6; margin: 0 0 22px; font-size: 13px; }
  h2 { font-size: 13px; color: #9d96ad; letter-spacing: .08em; margin: 24px 0 10px;
       font-weight: 500; text-transform: uppercase; }
  .item { display: flex; align-items: center; gap: 14px; max-width: 700px;
          background: #1e1b26; border: 1px solid #322c40; border-radius: 12px;
          padding: 10px 14px; margin-bottom: 8px; }
  .item .name { width: 118px; font-weight: 600; font-size: 15px; }
  .item .tag { font-size: 11px; color: #948da6; border: 1px solid #3a3348;
               padding: 1px 7px; border-radius: 999px; min-width: 82px; text-align: center; }
  .item audio { flex: 1; height: 32px; }
  .item .line { color: #7f7890; font-size: 12px; width: 210px; }
  button { font: inherit; padding: 8px 16px; border-radius: 9px; border: 1px solid #3d3550;
           background: #2a2436; color: #ece8f4; cursor: pointer; }
  button:hover { background: #352d45; }
  .bar { display: flex; gap: 10px; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>雌小鬼音色</h1>
  <p class="sub">同一句挑衅台词，换音色；最后两条是同一音色换语气强度。</p>

  <div class="bar">
    <button id="all">依次播放</button>
    <button id="stop">停</button>
  </div>

  <h2>音色对比</h2>
  <div class="item"><div class="name">Ono Anna</div><span class="tag">软糯雌小鬼</span>
    <audio controls preload="auto" src="samples/m_ono_anna_000.wav"></audio></div>
  <div class="item"><div class="name">Vivian</div><span class="tag">清亮雌小鬼</span>
    <audio controls preload="auto" src="samples/m_vivian_000.wav"></audio></div>
  <div class="item"><div class="name">Sohee</div><span class="tag">韩系雌小鬼</span>
    <audio controls preload="auto" src="samples/m_sohee_000.wav"></audio></div>
  <div class="item"><div class="name">Serena</div><span class="tag">成熟雌小鬼</span>
    <audio controls preload="auto" src="samples/m_serena_000.wav"></audio></div>

  <h2>语气强度（都是 Ono Anna）</h2>
  <div class="item"><div class="name">轻挑版</div><span class="tag">开玩笑</span>
    <audio controls preload="auto" src="samples/m_light_000.wav"></audio>
    <div class="line">杂鱼~ 就这点本事吗</div></div>
  <div class="item"><div class="name">欠揍版</div><span class="tag">拖长尾音</span>
    <audio controls preload="auto" src="samples/m_heavy_000.wav"></audio>
    <div class="line">哼，杂鱼就是杂鱼</div></div>

<script>
  const players = Array.from(document.querySelectorAll("audio"));
  let stopped = false;
  document.getElementById("stop").addEventListener("click", () => {
    stopped = true;
    players.forEach((a) => { a.pause(); a.currentTime = 0; });
  });
  document.getElementById("all").addEventListener("click", async () => {
    stopped = false;
    for (const a of players) {
      if (stopped) break;
      a.currentTime = 0;
      await a.play().catch(() => {});
      await new Promise((resolve) => {
        a.onended = resolve;
        const t = setInterval(() => {
          if (stopped || a.ended) { clearInterval(t); resolve(); }
        }, 200);
      });
    }
  });
</script>
</body>
</html>
