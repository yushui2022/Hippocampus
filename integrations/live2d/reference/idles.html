<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>四条待机 · 对比</title>
<style>
  html, body { margin: 0; background: #14121a; color: #ece8f4;
               font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  body { padding: 24px 28px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; }
  p.sub { color: #938ca4; margin: 0 0 20px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; max-width: 1200px; }
  .card { background: #1d1a25; border: 1px solid #322c40; border-radius: 14px; overflow: hidden; }
  .card .head { display: flex; align-items: center; justify-content: space-between;
                padding: 10px 14px; font-size: 14px; }
  .card .tag { color: #8f889e; font-size: 12px; }
  .stage { position: relative; aspect-ratio: 16 / 9; background: #0e0c12; }
  .stage img, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stage img { object-fit: cover; filter: brightness(0.85) blur(1px); }
  .stage video { object-fit: contain; }
  .row { display: flex; gap: 18px; margin-top: 22px; max-width: 1200px; }
  .row .card { flex: 1; }
</style>
</head>
<body>
  <h1>四条待机</h1>
  <p class="sub">同一站姿、同一构图，只有微动作和眨眼节奏不同。直播时依次播放，一轮 20.7 秒。</p>

  <div class="grid">
    <div class="card">
      <div class="head"><span>idle_a</span><span class="tag">seed 771003</span></div>
      <div class="stage"><img src="../assets/room.png" alt=""><video src="../assets/small/idle_a.webm" autoplay loop muted playsinline></video></div>
    </div>
    <div class="card">
      <div class="head"><span>idle_b</span><span class="tag">seed 771007</span></div>
      <div class="stage"><img src="../assets/room.png" alt=""><video src="../assets/small/idle_b.webm" autoplay loop muted playsinline></video></div>
    </div>
    <div class="card">
      <div class="head"><span>idle_c</span><span class="tag">seed 771008</span></div>
      <div class="stage"><img src="../assets/room.png" alt=""><video src="../assets/small/idle_c.webm" autoplay loop muted playsinline></video></div>
    </div>
    <div class="card">
      <div class="head"><span>idle_d</span><span class="tag">seed 771009</span></div>
      <div class="stage"><img src="../assets/room.png" alt=""><video src="../assets/small/idle_d.webm" autoplay loop muted playsinline></video></div>
    </div>
  </div>

  <div class="row">
    <div class="card">
      <div class="head"><span>talk（说话）</span><span class="tag">seed 660213</span></div>
      <div class="stage"><img src="../assets/room.png" alt=""><video src="../assets/small/talk.webm" autoplay loop muted playsinline></video></div>
    </div>
    <div class="card">
      <div class="head"><span>click（点击反应）</span><span class="tag">seed 660202</span></div>
      <div class="stage"><img src="../assets/room.png" alt=""><video src="../assets/small/click.webm" autoplay loop muted playsinline></video></div>
    </div>
  </div>
</body>
</html>
