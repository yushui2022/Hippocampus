<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>clip review</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 28px 32px 60px; background: #14121a; color: #e8e4f0;
         font: 15px/1.6 -apple-system, "Hiragino Sans GB", "PingFang SC", sans-serif; }
  h1 { font-size: 22px; margin: 0 0 6px; font-weight: 600; }
  p.sub { color: #9a94a8; margin: 0 0 26px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 22px; }
  .card { background: #1e1b26; border: 1px solid #332d40; border-radius: 14px; padding: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 2px; font-weight: 600; }
  .card .meta { color: #8f889e; font-size: 13px; margin-bottom: 10px; }
  .stage { border-radius: 10px; overflow: hidden; background: #0e0c12; aspect-ratio: 16/9; display: grid; place-items: center; }
  .stage video { width: 100%; height: 100%; object-fit: contain; }
  .ok { color: #7ee0a3; }
  .bad { color: #ff8a7a; }
  .warn { color: #ffcf70; }
</style>
</head>
<body>
  <h1>素材对比</h1>
  <p class="sub">同一条待机动画，三种规格。点播放看动态；带 alpha 的会显示在深色底上。</p>
  <div class="grid">
    <div class="card">
      <h2>现在网页在用 <span class="ok">OK</span></h2>
      <div class="meta">854×480 · 4 步 · crf 20 · 5.17s</div>
      <div class="stage"><video src="../assets/small/idle.webm" autoplay loop muted playsinline></video></div>
    </div>
    <div class="card">
      <h2>768p 8 步 <span class="bad">失控</span></h2>
      <div class="meta">1344×768 · 8 步 · 88% 构图 — 约 2 秒后推成特写</div>
      <div class="stage"><video src="h3_idle768_full.mp4" controls muted playsinline></video></div>
    </div>
    <div class="card">
      <h2>1080p 4 步 <span class="warn">测试片段</span></h2>
      <div class="meta">1920×1088 · 4 步 · 39 帧 1.6s · 70% 构图</div>
      <div class="stage"><video src="h3_p1080_test.mp4" controls muted playsinline></video></div>
    </div>
    <div class="card">
      <h2>说话 <span class="ok">OK</span></h2>
      <div class="meta">854×480 · 4 步 · 5.17s</div>
      <div class="stage"><video src="../assets/small/talk.webm" autoplay loop muted playsinline></video></div>
    </div>
    <div class="card">
      <h2>点击反应 <span class="ok">OK</span></h2>
      <div class="meta">854×480 · 4 步 · 5.17s</div>
      <div class="stage"><video src="../assets/small/click.webm" autoplay loop muted playsinline></video></div>
    </div>
  </div>
</body>
</html>
