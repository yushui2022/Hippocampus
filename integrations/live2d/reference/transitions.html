<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>进入 / 收回 · 单看</title>
<style>
  html, body { margin: 0; background: #12101a; color: #ece8f4;
               font: 15px/1.6 -apple-system, "PingFang SC", sans-serif; }
  body { padding: 22px 26px 40px; }
  h1 { font-size: 19px; margin: 0 0 4px; font-weight: 600; }
  p.sub { color: #918aa2; margin: 0 0 18px; font-size: 13px; }
  .row { display: flex; gap: 18px; }
  .card { flex: 1; background: #1d1a26; border: 1px solid #322c40; border-radius: 14px; overflow: hidden; }
  .head { display: flex; justify-content: space-between; padding: 10px 14px; font-size: 14px; }
  .head .t { color: #8f889e; font-size: 12px; }
  .stage { position: relative; aspect-ratio: 16/9; background: #0e0c12; }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
               filter: brightness(.85) blur(1px); }
  .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .bar { display: flex; gap: 10px; margin-bottom: 16px; }
  button { font: inherit; padding: 8px 16px; border-radius: 9px; border: 1px solid #3d3550;
           background: #2a2436; color: #ece8f4; cursor: pointer; }
  button:hover { background: #352d45; }
</style>
</head>
<body>
  <h1>进入 / 收回</h1>
  <p class="sub">左边是「掏出手机」，右边是「收起手机」。各循环播放，中间停 0.8 秒再看下一个。</p>

  <div class="bar">
    <button id="slow">慢放 0.5×</button>
    <button id="normal">正常速度</button>
  </div>

  <div class="row">
    <div class="card">
      <div class="head"><span>work_in · 掏出</span><span class="t">73 帧 / 3.04s</span></div>
      <div class="stage">
        <img src="../assets/room.png" alt="">
        <video id="a" src="../assets/small/work_in.webm" muted playsinline></video>
      </div>
    </div>
    <div class="card">
      <div class="head"><span>work_out · 收回</span><span class="t">73 帧 / 3.04s</span></div>
      <div class="stage">
        <img src="../assets/room.png" alt="">
        <video id="b" src="../assets/small/work_out.webm" muted playsinline></video>
      </div>
    </div>
  </div>

<script>
  const a = document.getElementById("a");
  const b = document.getElementById("b");

  function loop(v) {
    v.currentTime = 0;
    v.play().catch(() => {});
    v.onended = () => setTimeout(() => loop(v), 800);
  }
  loop(a); loop(b);

  document.getElementById("slow").onclick = () => { a.playbackRate = .5; b.playbackRate = .5; };
  document.getElementById("normal").onclick = () => { a.playbackRate = 1; b.playbackRate = 1; };
</script>
</body>
</html>
