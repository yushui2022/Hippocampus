[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hippocampus-memory"
version = "0.2.0"
description = "A memory kernel that forgets like a human: graded forgetting, plasticity, hybrid recall, and sourced facts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Orlando" }]
keywords = ["memory", "llm", "agents", "forgetting", "fsrs", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.23"]
faiss = ["faiss-cpu>=1.7"]
dev = ["pytest>=7"]

[project.scripts]
hippo-eval = "eval.replay_30d:main"
hippo-bench = "eval.bench:main"
hippo-paraphrase = "eval.paraphrase:main"
hippo-false-memory = "eval.false_memory:main"

[tool.setuptools.packages.find]
include = ["hippocampus*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
